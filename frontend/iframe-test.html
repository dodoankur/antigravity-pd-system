<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IframeUI — Test Page</title>
    <style>
        /* ── Reset ── */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #1e1e2e;
            --surface: #181825;
            --border: #313244;
            --muted: #6c7086;
            --text: #cdd6f4;
            --subtext: #a6adc8;
            --blue: #89b4fa;
            --green: #a6e3a1;
            --yellow: #f9e2af;
            --red: #f38ba8;
            --purple: #cba6f7;
            --sidebar-w: 320px;
            --topbar-h: 54px;
        }

        html,
        body {
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ─────────────────────────────────────────────
           TOP BAR
        ───────────────────────────────────────────── */
        .topbar {
            height: var(--topbar-h);
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-shrink: 0;
            z-index: 50;
        }

        .topbar-title {
            font-size: 0.92rem;
            font-weight: 600;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Hide long title text on very small screens */
        .topbar-title-text {
            display: inline;
        }

        .topbar-badge {
            font-size: 0.65rem;
            font-weight: 700;
            background: var(--green);
            color: var(--bg);
            padding: 2px 8px;
            border-radius: 20px;
            letter-spacing: 0.04em;
            flex-shrink: 0;
        }

        .topbar-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        .topbar-btn {
            padding: 7px 14px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 0.78rem;
            font-weight: 600;
            transition: opacity 0.15s;
            white-space: nowrap;
        }

        .topbar-btn:hover {
            opacity: 0.82;
        }

        .topbar-btn--primary {
            background: var(--blue);
            color: var(--bg);
        }

        .topbar-btn--secondary {
            background: var(--border);
            color: var(--text);
        }

        /* Toggle sidebar button — mobile only */
        .topbar-btn--toggle {
            display: none;
            background: var(--border);
            color: var(--text);
        }

        /* ─────────────────────────────────────────────
           MAIN LAYOUT
        ───────────────────────────────────────────── */
        .layout {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr var(--sidebar-w);
            grid-template-rows: 1fr;
            min-height: 0;
            overflow: hidden;
        }

        /* ─────────────────────────────────────────────
           PREVIEW AREA
        ───────────────────────────────────────────── */
        .preview-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 24px 20px;
            gap: 16px;
            background: var(--bg);
            overflow: auto;
        }

        .preview-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 900px;
            gap: 12px;
            flex-wrap: wrap;
        }

        .preview-label {
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--muted);
        }

        /* Viewport switcher — in preview header on desktop */
        .viewport-btns {
            display: flex;
            gap: 6px;
        }

        .viewport-btn {
            padding: 7px 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--subtext);
            font-size: 0.76rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
        }

        .viewport-btn:hover {
            border-color: var(--blue);
            color: var(--blue);
        }

        .viewport-btn.active {
            background: #89b4fa22;
            border-color: var(--blue);
            color: var(--blue);
        }

        /* ── Device frame ── */
        .device-frame-wrap {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            width: 100%;
        }

        .device-frame {
            position: relative;
            background: var(--surface);
            border-radius: 16px;
            overflow: hidden;
            box-shadow:
                0 0 0 2px #45475a,
                0 20px 50px rgba(0, 0, 0, 0.55);
            transition: width 0.3s ease, height 0.3s ease;
            /* Never overflow the preview area */
            max-width: 100%;
        }

        /* Sizes — capped so they never exceed viewport */
        .device-frame--mobile {
            width: min(480px, 100%);
            height: min(820px, calc(100svh - var(--topbar-h) - 100px));
        }

        .device-frame--tablet {
            width: min(680px, 100%);
            height: min(900px, calc(100svh - var(--topbar-h) - 100px));
        }

        .device-frame--full {
            width: min(860px, 100%);
            height: min(820px, calc(100svh - var(--topbar-h) - 100px));
        }

        .device-frame iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* ─────────────────────────────────────────────
           SIDEBAR
        ───────────────────────────────────────────── */
        .sidebar {
            background: var(--surface);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            min-height: 0;
        }

        .sidebar-section {
            padding: 18px 18px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .sidebar-section-title {
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 12px;
        }

        /* Sidebar viewport switcher (tablet breakpoint shows it here) */
        .sidebar-viewport {
            display: none;
        }

        /* ── Event log ── */
        .event-log {
            background: #11111b;
            border-radius: 8px;
            padding: 10px 12px;
            font-family: 'Menlo', 'Fira Code', 'Consolas', monospace;
            font-size: 0.75rem;
            min-height: 120px;
            max-height: 240px;
            overflow-y: auto;
            line-height: 1.6;
            color: var(--subtext);
        }

        .log-entry {
            margin-bottom: 3px;
        }

        .log-time {
            color: var(--muted);
            margin-right: 6px;
        }

        .log-type {
            font-weight: 700;
            margin-right: 4px;
        }

        .log-type--pd {
            color: var(--green);
        }

        .log-type--info {
            color: var(--blue);
        }

        .log-type--warn {
            color: var(--yellow);
        }

        .log-type--error {
            color: var(--red);
        }

        .log-type--event {
            color: var(--purple);
        }

        /* ── PD Result box ── */
        .result-box {
            background: #11111b;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px;
        }

        .result-empty {
            color: var(--muted);
            font-size: 0.8rem;
            text-align: center;
            padding: 10px 0;
        }

        .result-value-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 7px 0;
            border-bottom: 1px solid var(--border);
        }

        .result-value-row:last-child {
            border-bottom: none;
        }

        .result-key {
            font-size: 0.78rem;
            color: var(--muted);
        }

        .result-val {
            font-size: 0.88rem;
            font-weight: 700;
            color: var(--text);
        }

        .result-val--highlight {
            color: var(--green);
            font-size: 1.05rem;
        }

        /* ── Info chips ── */
        .info-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .info-chip {
            background: var(--border);
            border-radius: 20px;
            padding: 4px 10px;
            font-size: 0.7rem;
            color: var(--subtext);
        }

        /* ─────────────────────────────────────────────
           MOBILE SIDEBAR DRAWER
        ───────────────────────────────────────────── */
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 80;
            backdrop-filter: blur(2px);
        }

        .sidebar-overlay.open {
            display: block;
        }

        /* ─────────────────────────────────────────────
           SCROLLBAR
        ───────────────────────────────────────────── */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #45475a;
            border-radius: 3px;
        }

        /* ══════════════════════════════════════════
           RESPONSIVE BREAKPOINTS
        ══════════════════════════════════════════ */

        /* ── Tablet: ≤ 900px — sidebar moves into toggle drawer ── */
        @media (max-width: 900px) {
            :root {
                --sidebar-w: 0px;
            }

            .layout {
                grid-template-columns: 1fr;
            }

            /* Sidebar becomes a fixed right drawer */
            .sidebar {
                position: fixed;
                top: var(--topbar-h);
                right: 0;
                bottom: 0;
                width: min(300px, 85vw);
                border-left: 1px solid var(--border);
                transform: translateX(100%);
                transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
                z-index: 90;
                overflow-y: auto;
            }

            .sidebar.open {
                transform: translateX(0);
                box-shadow: -8px 0 32px rgba(0, 0, 0, 0.5);
            }

            /* Show overlay when sidebar open */
            .sidebar-overlay {
                display: none;
            }

            .sidebar-overlay.open {
                display: block;
            }

            /* Show toggle button in topbar */
            .topbar-btn--toggle {
                display: flex;
                align-items: center;
                gap: 6px;
            }

            /* Move viewport switcher into preview header (already there) */
            .preview-area {
                padding: 16px 14px;
            }

            .device-frame--mobile {
                width: min(400px, 100%);
            }

            .device-frame--tablet {
                width: min(600px, 100%);
            }

            .device-frame--full {
                width: 100%;
            }
        }

        /* ── Mobile: ≤ 600px ── */
        @media (max-width: 600px) {
            .topbar {
                padding: 0 14px;
            }

            .topbar-title-text {
                display: none;
            }

            /* hide \"Open full page\" on mobile */

            .preview-area {
                padding: 12px 10px;
                gap: 12px;
            }

            .preview-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            /* Compact viewport buttons */
            .viewport-btn {
                padding: 6px 10px;
                font-size: 0.72rem;
            }

            /* Device frames always full-width on mobile */
            .device-frame--mobile,
            .device-frame--tablet,
            .device-frame--full {
                width: 100%;
                height: min(680px, calc(100svh - var(--topbar-h) - 130px));
                border-radius: 12px;
            }
        }

        /* ── Large desktop: ≥ 1280px ── */
        @media (min-width: 1280px) {
            :root {
                --sidebar-w: 360px;
            }
        }
    </style>
</head>

<body>

    <!-- ── Overlay (closes sidebar on tap-outside) ── -->
    <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>

    <!-- ── Top bar ── -->
    <div class="topbar">
        <div class="topbar-title">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#89b4fa" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
            </svg>
            <span class="topbar-title-text">Embedded PD Test</span>
            <span class="topbar-badge">DEV</span>
        </div>
        <div class="topbar-actions">
            <button class="topbar-btn topbar-btn--secondary" onclick="reloadIframe()">↺ Reload</button>
            <button class="topbar-btn topbar-btn--primary"
                onclick="window.open(window.location.origin + '/embed','_blank')">Open ↗</button>
            <button class="topbar-btn topbar-btn--toggle" onclick="toggleSidebar()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2" />
                    <line x1="15" y1="3" x2="15" y2="21" />
                </svg>
                Panel
            </button>
        </div>
    </div>

    <!-- ── Main layout ── -->
    <div class="layout">

        <!-- Preview -->
        <div class="preview-area" id="preview-area">

            <div class="preview-header">
                <span class="preview-label" id="preview-label">📱 Mobile (480 × 820)</span>

                <!-- Viewport switcher lives in preview header -->
                <div class="viewport-btns">
                    <button class="viewport-btn active" onclick="setViewport('mobile', this)">📱 Mobile</button>
                    <button class="viewport-btn" onclick="setViewport('tablet', this)">📟 Tablet</button>
                    <button class="viewport-btn" onclick="setViewport('full',   this)">🖥 Full</button>
                </div>
            </div>

            <div class="device-frame-wrap">
                <div class="device-frame device-frame--mobile" id="device-frame">
                    <iframe id="pd-embed-iframe" src="/embed" allow="camera; microphone"
                        allowfullscreen>
                    </iframe>
                </div>
            </div>

        </div>

        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">

            <!-- Last PD result -->
            <div class="sidebar-section">
                <div class="sidebar-section-title">Last PD Result</div>
                <div class="result-box" id="result-box">
                    <p class="result-empty">No measurement yet.<br>Complete a scan in the iframe.</p>
                </div>
            </div>

            <!-- postMessage event log -->
            <div class="sidebar-section">
                <div class="sidebar-section-title">Event Log</div>
                <div class="event-log" id="event-log">
                    <div class="log-entry">
                        <span class="log-time">--:--:--</span>
                        <span class="log-type log-type--info">INFO</span>
                        Waiting for postMessage…
                    </div>
                </div>
            </div>

            <!-- Info chips -->
            <div class="sidebar-section">
                <div class="sidebar-section-title">Info</div>
                <div class="info-chips">
                    <span class="info-chip">src → /embed</span>
                    <span class="info-chip">PD_RESULT</span>
                    <span class="info-chip">PD_CLOSE</span>
                    <span class="info-chip">allow="camera"</span>
                    <span class="info-chip">HEIC support</span>
                    <span class="info-chip">Camera flip</span>
                </div>
            </div>

        </div>
    </div>

    <script>
        // ── Viewport switcher ──────────────────────────────────────────────────

        const VIEWPORTS = {
            mobile: { cls: 'device-frame--mobile', label: '📱 Mobile (480 × 820)' },
            tablet: { cls: 'device-frame--tablet', label: '📟 Tablet (680 × 900)' },
            full: { cls: 'device-frame--full', label: '🖥 Full width (860 × 820)' },
        };

        function setViewport(name, btn) {
            const frame = document.getElementById('device-frame');
            const label = document.getElementById('preview-label');
            Object.values(VIEWPORTS).forEach(v => frame.classList.remove(v.cls));
            frame.classList.add(VIEWPORTS[name].cls);
            label.textContent = VIEWPORTS[name].label;
            document.querySelectorAll('.viewport-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        // ── Sidebar toggle (mobile / tablet) ──────────────────────────────────

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            const isOpen = sidebar.classList.contains('open');
            isOpen ? closeSidebar() : openSidebar();
        }

        function openSidebar() {
            document.getElementById('sidebar').classList.add('open');
            document.getElementById('sidebar-overlay').classList.add('open');
        }

        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('sidebar-overlay').classList.remove('open');
        }

        // Close sidebar on resize back to desktop
        window.addEventListener('resize', () => {
            if (window.innerWidth > 900) closeSidebar();
        });

        // ── Reload iframe ──────────────────────────────────────────────────────

        function reloadIframe() {
            const iframe = document.getElementById('pd-embed-iframe');
            iframe.src = iframe.src;
            addLog('info', 'iframe reloaded');
        }

        // ── Event log ──────────────────────────────────────────────────────────

        function addLog(type, msg) {
            const log = document.getElementById('event-log');
            const now = new Date().toTimeString().slice(0, 8);
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `<span class="log-time">${now}</span><span class="log-type log-type--${type}">${type.toUpperCase()}</span> ${msg}`;
            log.appendChild(entry);
            log.scrollTop = log.scrollHeight;
        }

        // ── postMessage listener ───────────────────────────────────────────────

        window.addEventListener('message', function (e) {
            if (!e.origin.includes('localhost')) return;
            const data = e.data;

            if (data && data.type === 'PD_RESULT') {
                addLog('pd', `PD_RESULT — Overall: ${data.overall_pd_mm}mm  R: ${data.right_pd_mm}mm  L: ${data.left_pd_mm}mm`);
                renderResult(data);
                // Auto-open sidebar on mobile so result is visible
                if (window.innerWidth <= 900) openSidebar();
            } else if (data && data.type === 'PD_CLOSE') {
                addLog('event', 'PD_CLOSE received — iframe requested close');
            } else if (data) {
                addLog('event', `msg: ${JSON.stringify(data).slice(0, 80)}`);
            }
        });

        function renderResult(data) {
            document.getElementById('result-box').innerHTML = `
                <div class="result-value-row">
                    <span class="result-key">Overall PD</span>
                    <span class="result-val result-val--highlight">${data.overall_pd_mm} mm</span>
                </div>
                <div class="result-value-row">
                    <span class="result-key">Right PD</span>
                    <span class="result-val">${data.right_pd_mm} mm</span>
                </div>
                <div class="result-value-row">
                    <span class="result-key">Left PD</span>
                    <span class="result-val">${data.left_pd_mm} mm</span>
                </div>
            `;
        }

        // ── iframe load log ────────────────────────────────────────────────────

        document.getElementById('pd-embed-iframe').addEventListener('load', function () {
            addLog('info', 'iframe loaded → /embed');
        });
    </script>

</body>

</html>
