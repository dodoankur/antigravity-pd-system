[project]
name = "backend"
version = "0.1.0"
description = "PD Measurement API backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.109.2",
    "mediapipe==0.10.14",
    "numpy==1.26.4",
    "opencv-python==4.9.0.80",
    "pillow==10.3.0",
    "pydantic==2.6.1",
    "python-multipart==0.0.9",
    "uvicorn[standard]==0.27.1",
    "slowapi",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", "venv", "__pycache__"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501",  # line-length — handled by formatter
    "B008",  # do not perform function calls in default args (FastAPI Depends pattern)
]

[tool.ruff.lint.isort]
known-first-party = ["models", "services"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
